<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0d0f12"/>
  <!-- film strip body: vertical, off-center left, cropped at top -->
  <path d="M 58 28 L 142 28 L 142 228 L 58 228 Z" fill="#e8e4d9"/>
  <!-- sprocket holes along the strip: stencil-cut rectangles -->
  <rect x="70" y="44" width="26" height="20" fill="#0d0f12"/>
  <rect x="70" y="80" width="26" height="20" fill="#0d0f12"/>
  <rect x="70" y="150" width="26" height="20" fill="#0d0f12"/>
  <rect x="70" y="186" width="26" height="20" fill="#0d0f12"/>
  <!-- right-side sprocket cutouts, offset for stencil look -->
  <rect x="112" y="62" width="22" height="16" fill="#0d0f12"/>
  <rect x="112" y="98" width="22" height="16" fill="#0d0f12"/>
  <rect x="112" y="168" width="22" height="16" fill="#0d0f12"/>
  <rect x="112" y="202" width="22" height="16" fill="#0d0f12"/>
  <!-- central keyed cylinder pin, half-inserted through the strip -->
  <!-- cylinder body (shaft) angled slightly, overlapping strip edge -->
  <polygon points="128,112 214,88 222,116 136,140" fill="#c8452b"/>
  <!-- keyed notch / pin head face -->
  <polygon points="214,88 244,80 252,108 222,116" fill="#f2a33c"/>
  <!-- insert side showing sprocket-fusion: notched tip half in strip -->
  <polygon points="128,112 136,140 118,144 110,116" fill="#e8e4d9"/>
  <!-- key slot cut in the pin head -->
  <polygon points="226,92 244,87 248,101 230,106" fill="#0d0f12"/>
  <!-- grain / stencil specks -->
  <rect x="88" y="128" width="4" height="4" fill="#0d0f12"/>
  <rect x="100" y="134" width="3" height="3" fill="#0d0f12"/>
  <rect x="82" y="118" width="3" height="3" fill="#0d0f12"/>
  <rect x="146" y="120" width="3" height="3" fill="#0d0f12"/>
  <rect x="156" y="112" width="3" height="3" fill="#0d0f12"/>
  <rect x="166" y="104" width="3" height="3" fill="#0d0f12"/>
  <rect x="196" y="96" width="3" height="3" fill="#0d0f12"/>
  <!-- diagonal stencil slot cut through strip for brutalism -->
  <polygon points="58,158 100,146 100,152 58,164" fill="#0d0f12"/>
  <!-- small tension block at bottom of strip -->
  <polygon points="142,214 158,210 158,228 142,228" fill="#f2a33c"/>
  <polygon points="58,214 74,210 74,228 58,228" fill="#c8452b"/>
</svg>
